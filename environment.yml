name: faceocc

channels:
  - conda-forge

# Micromamba owns only the portable Python base. GPU-enabled PyTorch is
# installed by setup.sh from PyTorch's official CUDA 13.2 wheel index so the
# repository never depends on a system-wide CUDA Toolkit.
dependencies:
  - python=3.12.13
  - pip
  - setuptools
  - wheel
